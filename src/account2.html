<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts2</title>
    <!-- <link rel="stylesheet" href="./output.css" /> -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="font-sans m-0 p-0 text-gray-800 min-h-screen flex flex-col"
    style="
      background-image: url(&quot;./Assests/image/register\ \(1\).png&quot;);
    "
  >
    <div class="flex flex-1">
      <aside
        class="w-64 border-r border-gray-200/60 flex flex-col justify-between p-6 hidden md:flex"
      >
        <div>
          <div class="flex items-center space-x-3 mb-10">
            <img
              src="./Assests/image/logo.png"
              alt="Reen-Bank Logo"
              class="h-10 object-contain"
            />
          </div>
          <nav class="space-y-2">
            <a
              href="./dash2.html"
              class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-white/60 hover:text-gray-900 transition-colors"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                ></path>
              </svg>
              <span>Overview</span>
            </a>
            <a
              href="./account2.html"
              class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-white text-emerald-600 font-medium shadow-sm"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"
                ></path>
              </svg>
              <span>Accounts</span>
            </a>
            <a
              href="./Trascation2.html"
              class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-white/60 hover:text-gray-900 transition-colors"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
                ></path>
              </svg>
              <span>Transactions</span>
            </a>
            <a
              href="./profile.html"
              class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-white/60 hover:text-gray-900 transition-colors"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
              <span>Profile</span>
            </a>
          </nav>
        </div>
        <div>
          <a
            href="./index.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              ></path>
            </svg>
            <span>Logout</span>
          </a>
        </div>
      </aside>

      <main class="flex-1 p-8 overflow-y-auto">
        <header
          class="flex flex-col md:flex-row md:items-center justify-between pb-8 mb-8 border-b border-gray-200/60 gap-4"
        >
          <h1 class="text-3xl font-bold text-gray-900">Accounts</h1>

          <div class="flex items-center space-x-6">
            <div class="text-right hidden sm:block">
              <p class="text-2xl font-bold text-emerald-600">Joseph</p>
              <p class="text-lg font-bold text-gray-900 tracking-wider">
                3110800230
              </p>
            </div>
            <div class="relative">
              <span
                class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  ></path>
                </svg>
              </span>
              <input
                type="text"
                id="search-input"
                placeholder="Search accounts..."
                class="pl-9 pr-4 py-2 rounded-xl text-sm border border-gray-200 focus:outline-none focus:border-emerald-500 w-48 md:w-64 shadow-sm"
              />
            </div>
            <div class="relative">
              <button
                id="notification-bell-btn"
                class="p-2 bg-gray-200 rounded-xl border border-gray-200 text-gray-600 hover:text-emerald-600 shadow-sm cursor-pointer relative"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                  ></path>
                </svg>
                <span
                  id="notification-badge"
                  class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm"
                  >1</span
                >
              </button>
              <div
                id="notification-dropdown"
                class="absolute right-0 mt-3 w-80 bg-white/60 rounded-2xl shadow-xl border border-gray-100 hidden z-50 overflow-hidden"
              >
                <div
                  class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50"
                >
                  <h4 class="font-bold text-gray-900 text-sm">Notifications</h4>
                  <button
                    id="mark-all-read-btn"
                    class="text-xs text-emerald-600 font-medium hover:underline cursor-pointer"
                  >
                    Mark all as read
                  </button>
                </div>
                <div
                  id="notification-list"
                  class="max-h-72 overflow-y-auto divide-y divide-gray-50 text-xs"
                >
                  <div class="p-3 hover:bg-gray-50">
                    <p class="font-semibold text-gray-900">Account Ready</p>
                    <p class="text-gray-500">
                      Your dashboard has been initialized successfully.
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div
              class="w-10 h-10 rounded-full overflow-hidden border border-gray-300 shadow-sm"
            >
              <img
                src="./Assests/image/Ellipse 32.png"
                alt="Avatar"
                class="w-full h-full object-cover"
              />
            </div>
          </div>
        </header>
        <div>
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-900">Accounts</h3>
            <button
              id="add-account-btn"
              class="w-8 h-8 bg-white/60 border border-gray-200 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-50 shadow-sm cursor-pointer"
            >
              +
            </button>
          </div>
        </div>
        <div
          id="accounts-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10"
        >
          <div
            class="bg-green-100 p-6 rounded-3xl shadow-sm border border-emerald-100 flex flex-col justify-between account-card relative"
          >
            <div>
              <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-semibold text-purple-900 account-name"
                  >Main Account</span
                >
                <svg
                  class="w-4 h-4 text-gray-400 cursor-pointer toggle-visibility"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                  ></path>
                </svg>
              </div>
              <p
                class="account-balance text-2xl font-bold text-gray-900 tracking-tight mb-6 transition-all duration-200"
                data-balance="000.00"
              >
                ₦ 00.00
              </p>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button
                class="fund-btn py-2 px-3 bg-emerald-500 text-white rounded-xl font-medium text-xs hover:bg-emerald-600 shadow-sm transition-all cursor-pointer"
              >
                Fund
              </button>
              <button
                class="withdraw-btn py-2 px-3 bg-gray-200 text-gray-700 rounded-xl font-medium text-xs hover:bg-gray-300 transition-all cursor-pointer"
              >
                Withdraw
              </button>
            </div>
          </div>

          <!-- <div
            class="bg-green-100 p-6 rounded-3xl shadow-sm border border-emerald-100 flex flex-col justify-between account-card relative"
          >
            <div></div>
          </div> -->
        </div>
        <div class="shadow-sm p-6 border border-green-100">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-bold text-gray-900">Transactions</h3>
            <h3
              class="text-lg font-bold text-green-500 hover:underline cursor-pointer"
            ></h3>
            <button
              id="view-all-btn"
              class="text-emerald-600 hover:opacity-80 text-sm font-medium flex items-center space-x-1 cursor-pointer bg-transparent border-none"
            >
              <span>View All</span>
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                ></path>
              </svg>
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left md: border-collapse">
              <thead>
                <tr
                  class="text-xs text-gray-400 border-b border-gray-100 md: pb-3"
                >
                  <th class="pb-3 font-medium">Type</th>
                  <th class="pb-3 font-medium">Name</th>
                  <th class="pb-3 font-medium">Method / Account</th>
                  <th class="pb-3 font-medium">Timestamp</th>
                  <th class="pb-3 font-medium text-right">Amount</th>
                  <th class="pb-3 font-medium text-center">Status</th>
                </tr>
              </thead>
              <tbody
                id="transactions-tbody"
                class="divide-y divide-gray-50 text-sm"
              ></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div
      id="fund-modal"
      class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-3xl w-full max-w-md shadow-xl m-4">
        <h3 class="text-xl font-bold text-gray-900 mb-4">Fund Account</h3>
        <form id="fund-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Funding Method</label
            >
            <select
              id="fund-method"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 bg-white"
            >
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Direct Pay">Direct Pay</option>
              <option value="Credit Card">Credit Card</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Amount (₦)</label
            >
            <input
              type="number"
              id="fund-amount"
              required
              min="1"
              step="any"
              placeholder="e.g. 10000"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div class="flex justify-end space-x-3 pt-4">
            <button
              type="button"
              id="cancel-fund-btn"
              class="px-4 py-2 border border-gray-200 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-50 cursor-pointer"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700 cursor-pointer"
            >
              Proceed to Fund
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Withdraw Modal -->
    <div
      id="withdraw-modal"
      class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-3xl w-full max-w-md shadow-xl m-4">
        <h3 class="text-xl font-bold text-gray-900 mb-4">Withdraw Funds</h3>
        <form id="withdraw-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Account Number</label
            >
            <input
              type="text"
              id="withdraw-account-number"
              required
              placeholder="e.g. 0123456789"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Account Name</label
            >
            <input
              type="text"
              id="withdraw-account-name"
              required
              placeholder="e.g. Oluwaben Jamin"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Bank</label
            >
            <select
              id="withdraw-method"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 bg-white"
            >
              <option value="" disabled selected>Choose Nigerian Bank</option>
              <option value="Access Bank">Access Bank</option>
              <option value="GTB">Guaranty Trust Bank (GTB)</option>
              <option value="Zenith Bank">Zenith Bank</option>
              <option value="UBA">United Bank for Africa (UBA)</option>
              <option value="First Bank of Nigeria">
                First Bank of Nigeria
              </option>
              <option value="Kuda Bank">Kuda Bank</option>
              <option value="Opay">Opay</option>
              <option value="palmpay">palmpay</option>
              <option value="Moniepoint">Moniepoint</option>
              <option value="Fidelity Bank">Fidelity Bank</option>
              <option value="Stanbic IBTC Bank">Stanbic IBTC Bank</option>
              <option value="Union Bank">Union Bank</option>
              <option value="Sterling Bank">Sterling Bank</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1"
              >Amount (₦)</label
            >
            <input
              type="number"
              id="withdraw-amount"
              required
              min="1"
              step="any"
              placeholder="e.g. 5000"
              class="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div class="flex justify-end space-x-3 pt-4">
            <button
              type="button"
              id="cancel-withdraw-btn"
              class="px-4 py-2 border border-gray-200 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-50 cursor-pointer"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700 cursor-pointer"
            >
              Proceed to Withdraw
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="./account2.js"></script>
  </body>
</html>

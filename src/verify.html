<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Created</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-0 p-0">
    <section
      class="min-h-screen relative flex flex-col justify-between px-6 py-6 md:px-20 md:py-10 bg-cover bg-center bg-no-repeat"
      style="
        background-image: url(&quot;./Assests/image/register\ \(1\).png&quot;);
      "
    >
      <div class="z-10">
        <img src="./Assests/image/logo.png" alt="Reen-Bank Logo" class="h-10" />
      </div>
      <div class="my-auto flex items-center justify-center py-8 z-10">
        <div
          class="bg-white p-10 md:p-12 rounded-3xl shadow-2xl w-full max-w-lg text-center"
        >
          <div class="mb-6 flex justify-center">
            <div
              class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-green-600"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
            </div>
          </div>
          <h2 class="text-xl md:text-2xl font-semibold text-gray-800 mb-8">
            <span class="font-bold text-black">Your account</span> has been
            created Successfully!
          </h2>
          <div>
            <a
              href="./dash2.html"
              class="block w-full rounded-xl bg-green-500 py-4 text-white font-medium hover:bg-green-600 shadow-lg transition-colors text-center text-lg cursor-pointer"
            >
              Go to Dashboard
            </a>
          </div>
        </div>
      </div>
      <div class="h-10"></div>
      <script src="./dash2.html"></script>
    </section>
  </body>
</html>

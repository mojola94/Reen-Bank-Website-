<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get-Started</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-0 p-0">
    <section
      class="min-h-screen flex flex-col justify-between px-6 py-6 md:px-20 md:py-10 bg-cover bg-center bg-no-repeat"
      style="
        background-image: url(&quot;./Assests/image/register\ \(1\).png&quot;);
      "
    >
      <div>
        <img src="./Assests/image/logo.png" alt="Reen-Bank Logo" class="h-12" />
      </div>
      <div
        class="my-auto md:flex md:items-start md:justify-between md:gap-16 py-6"
      >
        <div class="md:w-[55%] mb-12 md:mb-0">
          <div>
            <h3 class="text-3xl font-bold text-green-600 md:text-5xl">
              Reen-Bank
            </h3>
          </div>

          <h1
            class="mt-4 text-4xl font-extrabold text-black md:text-6xl leading-[1.15]"
          >
            Experience <br />
            hassle-free banking
          </h1>

          <p class="mt-6 text-lg text-gray-700 md:text-2xl leading-relaxed">
            Experience simple, secure, and stress-free banking. Say goodbye to
            long queues and complex procedures and hello to hassle-free banking
            with Reen Bank.
          </p>
          <div class="flex space-x-6 text-green-600 items-center mt-8">
            <a href="#" class="hover:opacity-80">
              <img
                src="./Assests/image/facebook overlay.png"
                alt="Facebook"
                class="w-7 h-7 object-contain"
              />
            </a>
            <a href="#" class="hover:opacity-80">
              <img
                src="./Assests/image/instagram overlay.png"
                alt="Instagram"
                class="w-7 h-7 object-contain"
              />
            </a>
            <a href="#" class="hover:opacity-80">
              <img
                src="./Assests/image/twitter overlay.png"
                alt="Twitter"
                class="w-7 h-7 object-contain"
              />
            </a>
          </div>
        </div>
        <div class="md:w-[42%]">
          <section
            class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-auto"
          >
            <h3 class="text-green-600 font-bold text-3xl mb-6">Register</h3>

            <!-- FORM STARTS HERE -->
            <form id="register-form" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Name</label
                >
                <input
                  type="text"
                  name="Name"
                  id="user-name-input"
                  placeholder="Enter name here"
                  required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 text-black placeholder-gray-400 focus:outline-none focus:border-green-500"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Email</label
                >
                <input
                  type="email"
                  id="user-email-input"
                  name="Email"
                  placeholder="Enter your Email"
                  required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 text-black placeholder-gray-400 focus:outline-none focus:border-green-500"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="password"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your Password"
                  required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 text-black placeholder-gray-400 focus:outline-none focus:border-green-500"
                />
              </div>
              <div class="flex items-center space-x-2 pt-2">
                <input
                  type="checkbox"
                  id="terms"
                  name="terms"
                  required
                  class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500 cursor-pointer"
                />
                <label
                  for="terms"
                  class="text-xs sm:text-sm text-gray-500 cursor-pointer"
                >
                  I agree to all the
                  <a href="#" class="text-green-600 font-medium hover:underline"
                    >Terms</a
                  >,
                  <a href="#" class="text-green-600 font-medium hover:underline"
                    >Privacy Policy</a
                  >
                  and
                  <a href="#" class="text-green-600 font-medium hover:underline"
                    >Fees.</a
                  >
                </label>
              </div>
              <div class="pt-4">
                <button
                  type="submit"
                  class="block w-full rounded-xl bg-green-500 py-3.5 text-white font-medium hover:bg-green-600 shadow-md transition-colors text-center cursor-pointer"
                >
                  Register
                </button>
              </div>
            </form>
            <p class="mt-6 text-center text-sm text-gray-600">
              Already have an Account?
              <a
                href="./login.html"
                class="text-green-600 font-medium hover:underline"
                >Log in.</a
              >
            </p>
          </section>
        </div>
      </div>
    </section>

    <!-- BULLETPROOF VALIDATION SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const registerForm = document.getElementById("register-form");

        if (registerForm) {
          registerForm.addEventListener("submit", (e) => {
            // Check if all fields & checkbox are valid
            if (!registerForm.checkValidity()) {
              e.preventDefault(); // Stop submission completely
              alert(
                "Please fill out this form and accept the terms before registering.",
              );
              registerForm.reportValidity();
              return;
            }

            // If valid, prevent default momentarily to save email
            e.preventDefault();
            const emailInput = document.getElementById("user-email-input");
            if (emailInput && emailInput.value) {
              localStorage.setItem("registeredEmail", emailInput.value);
            }

            // Now safely redirect
            window.location.href = "./Email1.html";
          });
        }
      });
    </script>
  </body>
</html>
